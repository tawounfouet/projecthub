name: projecthub-e0

services:
  db:
    image: postgres:16.15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: projecthub
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?copy .env.example to .env and configure E0 secrets}
      E0_APP_DB_PASSWORD: ${E0_APP_DB_PASSWORD:?configure E0_APP_DB_PASSWORD}
      E0_MIGRATE_DB_PASSWORD: ${E0_MIGRATE_DB_PASSWORD:?configure E0_MIGRATE_DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./infra/initdb/01-roles.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d projecthub"]
      interval: 3s
      retries: 15

  migrate:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://ph_migrate:${E0_MIGRATE_DB_PASSWORD}@db:5432/projecthub
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      E0_SYNTHETIC_ONLY: "1"
    command: ["python", "manage.py", "migrate", "--noinput"]
    depends_on:
      db:
        condition: service_healthy

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://ph_app:${E0_APP_DB_PASSWORD}@db:5432/projecthub
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: "1"
      E0_SYNTHETIC_ONLY: "1"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,backend"
      DJANGO_CSRF_TRUSTED_ORIGINS: "http://localhost:3000"
    # Gunicorn WSGI rather than Django's development/autoreload server behind Next.
    command: ["sh", "-c", "python manage.py seed_e0 && exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --worker-class gthread --threads 4 --timeout 30 --access-logfile - --error-logfile -"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ready/', timeout=3)"]
      interval: 4s
      retries: 20

  web:
    build: ./frontend
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # Verify proxy-to-DB readiness, not merely that next start is running.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/ready/', { signal: AbortSignal.timeout(3000) }).then(r => process.exit(r.status === 200 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 4s
      retries: 20

volumes:
  db_data:
