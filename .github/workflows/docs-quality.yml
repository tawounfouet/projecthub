name: Documentation Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs-quality:
    name: docs-metadata-ids-links-and-fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout public repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pinned documentation dependencies
        run: python -m pip install -r docs/quality/requirements.txt
      - name: Execute positive and negative synthetic tests
        run: python -m unittest discover -s tests -p 'test_docs_quality.py' -v
      - name: Validate public metadata, registries and local links
        run: python scripts/docs_quality.py --strict
