name: Bug report
description: Report a reproducible non-security bug
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "For possible security vulnerabilities, do not open a public issue. Contact the maintainer privately."
  - type: textarea
    id: description
    attributes:
      label: What happened?
      validations:
        required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Use synthetic or public data only.
      validations:
        required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      validations:
        required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "Commit SHA or release"
